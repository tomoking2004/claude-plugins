name: scan

on:
  push:
    branches: [master]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan.py がマージを除く全コミットメッセージを検査する
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/scan.py
